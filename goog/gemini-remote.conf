# ============================================================
# Gemini / Google One — Quantumult X 配置（远程引用版）
# ============================================================
# 仓库:      https://github.com/yjlsx/qx
# 目录:      goog/
#
# ────────────────────────────────────────────────────────────
# ⚠ 为什么用 [rewrite_remote] 而不是 [rewrite_local]
# ────────────────────────────────────────────────────────────
# QX 官方文档明确写：
#   "The scripts for script-request-body / script-response-body ...
#    should be saved in local 'On My iPhone - Quantumult X - Scripts'"
# 即 [rewrite_local] 的脚本参数期望是【本地文件名】。
# 直接在里面写 https:// 远程地址，部分版本会解析失败报错。
#
# 正确做法是把「规则 + 远程脚本地址」做成 snippet，
# 用 [rewrite_remote] 引用——这是 QX 官方支持的远程规则机制，
# 社区配置（Orz-3 / app2smile 等）都这么写。
#
# 如果你更喜欢全部本地化，见文件末尾「方案 C：全本地」。
#
# ────────────────────────────────────────────────────────────
# ⚠ 必读 1：QUIC 必须关
# ────────────────────────────────────────────────────────────
# 原 sgmodule 用 AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP
# 拦 UDP/443 逼流量走 TCP。QX 没有 AND 逻辑操作符，无法等价转换。
# 不关 QUIC → one.google.com 走 HTTP/3 → MITM 看不到明文 → 脚本不触发。
#
#   a) 设置 → 其他设置 → 关闭「HTTP/3 (QUIC)」   ← 推荐
#   b) 节点服务端禁用 UDP
#   c) [general] 里加：udp_drop_list = QUIC
#
# ────────────────────────────────────────────────────────────
# ⚠ 必读 2：一条规则顺序
# ────────────────────────────────────────────────────────────
# snippet 里「管理页」必须排在「全站」前面，QX 命中即停。
# 已排好，不要手动调换。
# ============================================================


[general]
# 方案 c：从系统层面丢弃 QUIC，替代 sgmodule 的 UDP/443 拦截
# 如果已在设置里关了 HTTP/3，这行可以不要
udp_drop_list = QUIC


[mitm]
hostname = %APPEND% one.google.com, applecommerce-pa.googleapis.com, play.googleapis.com, accounts.google.com, www.googleapis.com, ogads-pa.clients6.google.com


[rewrite_remote]
# ★ 核心：一句话引入全部 rewrite 规则（规则与脚本都在 GitHub）
https://raw.githubusercontent.com/yjlsx/qx/main/goog/gemini-rewrite.snippet, tag=Gemini-GoogleOne, opt-parser=true, update-interval=86400, enabled=true

# 备用镜像（主地址超时时启用，与上面二选一）
# https://cdn.jsdelivr.net/gh/yjlsx/qx@main/goog/gemini-rewrite.snippet, tag=Gemini-GoogleOne, opt-parser=true, update-interval=86400, enabled=true


[task_local]
# 批量重放引擎（默认 dryRun，只发 prepare 不激活）
# 脚本走远程 URL 是 [task_local] 官方支持的形式
*/6 * * * * https://raw.githubusercontent.com/yjlsx/qx/main/goog/gemini_adv_replay.js, tag=Gemini高级商务重放, enabled=false


[filter_local]
# 默认直连，按需调整
# FINAL,DIRECT


# ============================================================
# 方案 C：全本地（不想用 remote 的话）
# ============================================================
#
# 1) 把 7 个脚本拷到 QX 的 Scripts 目录：
#      文件 App → On My iPhone → Quantumult X → Scripts
#
#      g1-acq.qx.js
#      g1-sku-report.qx.js
#      gemini_prepare_capture.js
#      gemini_prepare_response.js
#      gemini_sku_probe.js
#      gemini_activate_capture.js
#      gemini_adv_replay.js
#
# 2) 把下面的 [rewrite_local] 段替换掉上面的 [rewrite_remote] 段：
#
# [rewrite_local]
# ^https:\/\/one\.google\.com\/g1-sku-report\/?(\?.*)?$ url script-request-body g1-sku-report.qx.js reject
# ^https:\/\/one\.google\.com\/ url script-response-body g1-acq.qx.js
# ^https:\/\/applecommerce-pa\.googleapis\.com\/v1\/transactions:prepare url script-request-body gemini_prepare_capture.js reject-200
# ^https:\/\/applecommerce-pa\.googleapis\.com\/\$rpc\/google\.subscriptions\.apple\.commerce\.v1\.AppleCommerceService\/ListProducts url script-response-body gemini_sku_probe.js
# ^https:\/\/one\.google\.com\/_\/SubscriptionsManagementUi\/data\/batchexecute url script-request-body gemini_activate_capture.js
#
# [task_local]
# */6 * * * * gemini_adv_replay.js, tag=Gemini高级商务重放, enabled=false
#
# 注意：rewrite_local 里脚本参数只写文件名，不要带路径、不要带 URL。


# ============================================================
# 排错速查
# ============================================================
#
# 现象                            原因                     处理
# ────────────────────────────── ─────────────────────── ───────────────────
# 配置加载报错 / 规则标红          改写脚本参数写了 URL     改用 rewrite_remote
# status code 404                  snippet 拉取超时          换备用镜像
# 页面白屏 / SKU 没变              QUIC 没关                 关 HTTP/3
# 管理页 404                       管理页规则没生效          检查 rewrite_remote 是否启用
# 管理页开了但保存报 503           $prefs 不可用             QX 版本过老
# 收不到票据通知                   交易规则没生效            检查 MITM 域与 QUIC
# one.google.com 无任何流量        证书未信任                重装 MITM 证书
#
# ============================================================
