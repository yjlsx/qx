# ============================================================
# Gemini / Google One — Quantumult X 远程脚本配置
# ============================================================
# 仓库:      https://github.com/yjlsx/qx
# 目录:      goog/
# raw 前缀:  https://raw.githubusercontent.com/yjlsx/qx/main/goog/
#
# 用法（三选一）：
#   1. 整段粘贴进 QX 主配置对应 section
#   2. 存本地后用 资源引用 加载
#   3. 直接用 raw 地址作为 remote 配置：
#      https://raw.githubusercontent.com/yjlsx/qx/main/goog/gemini-remote.conf
#
# ────────────────────────────────────────────────────────────
# ⚠ 必读：QUIC 必须关
# ────────────────────────────────────────────────────────────
# 原 sgmodule 用 AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP
# 拦 UDP/443 逼流量走 TCP，QX 没有 AND 逻辑操作符，无法等价转换。
#
# 不关 QUIC 的后果：one.google.com 走 HTTP/3，MITM 看不到明文，
# 下面的 rewrite 全部不触发，脚本一次都不会执行。
#
# 做法（任选其一）：
#   a) 设置 → 其他设置 → 关闭「HTTP/3 (QUIC)」   ← 推荐
#   b) 节点服务端禁用 UDP
#   c) [filter_local] 加 DEST-PORT,443,REJECT-DROP,udp（会误伤全部 QUIC，慎用）
#
# ────────────────────────────────────────────────────────────
# ⚠ 必读：one.google.com 两条规则顺序不能反
# ────────────────────────────────────────────────────────────
# QX 按顺序匹配，命中即停。窄的（管理页）必须排在宽的（全站）前面。
# ============================================================


[mitm]

# G1 映射引擎与管理页所在域
hostname = %APPEND% one.google.com

# 高级商务交易链所在域（只用 G1 映射的话可以删掉这行）
hostname = %APPEND% applecommerce-pa.googleapis.com, play.googleapis.com, accounts.google.com, www.googleapis.com, ogads-pa.clients6.google.com


[rewrite_local]

# ══════════════════════════════════════════════════════════
# 一、G1 ACQ Plus 映射引擎（核心功能）
#     改写 one.google.com 页面里的 SKU，实现低价档位替换
# ══════════════════════════════════════════════════════════

# ①-1 管理页 + TXT/JSON 导出   ← 必须排在 ①-2 之前
#     访问 https://one.google.com/g1-sku-report 即可打开
#     • 切换 10 个预设（0.05 折 Pro / 土区 Ultra / 批量探测包等）
#     • 导出 TXT：?format=txt    导出 JSON：?format=json
^https:\/\/one\.google\.com\/g1-sku-report\/?(\?.*)?$ url script-request-body https://raw.githubusercontent.com/yjlsx/qx/main/goog/g1-sku-report.qx.js reject

# ①-2 SKU 映射改写（处理其余所有 one.google.com 响应）
#     脚本内部只对 /ai /plans /subscribe /upsell /about/plans 真正改写，
#     其余路径（如 batchexecute）自动放行，不会误伤
^https:\/\/one\.google\.com\/ url script-response-body https://raw.githubusercontent.com/yjlsx/qx/main/goog/g1-acq.qx.js


# ══════════════════════════════════════════════════════════
# 二、高级商务交易链抓取（可选，只做 G1 映射可整段注释）
#     抓 Apple 侧 transactions:prepare 的票据与 JWS
# ══════════════════════════════════════════════════════════

# ②-1 交易创建：拦请求
#     抓 txId / SKU / storefront，并伪 200 阻止进入 Apple 支付
^https:\/\/applecommerce-pa\.googleapis\.com\/v1\/transactions:prepare url script-request-body https://raw.githubusercontent.com/yjlsx/qx/main/goog/gemini_prepare_capture.js reject-200

# ②-1' 交易创建：抓响应（与 ②-1 二选一！）
#     能拿到 JWS 与 appAccountToken，但客户端会真的进 Apple 支付流程
#     用法：注释掉 ②-1，取消本行注释
# ^https:\/\/applecommerce-pa\.googleapis\.com\/v1\/transactions:prepare url script-response-body https://raw.githubusercontent.com/yjlsx/qx/main/goog/gemini_prepare_response.js

# ②-2 SKU 目录解析
#     把 ListProducts 的返回落成 $prefs.gemini_sku_catalog
^https:\/\/applecommerce-pa\.googleapis\.com\/\$rpc\/google\.subscriptions\.apple\.commerce\.v1\.AppleCommerceService\/ListProducts url script-response-body https://raw.githubusercontent.com/yjlsx/qx/main/goog/gemini_sku_probe.js

# ②-3 激活写入 RPC 探测（只记录，不拦截，不影响正常流程）
#     抓非只读 rpcid，付款成功后会出现，是激活环节的关键
^https:\/\/one\.google\.com\/_\/SubscriptionsManagementUi\/data\/batchexecute url script-request-body https://raw.githubusercontent.com/yjlsx/qx/main/goog/gemini_activate_capture.js


[task_local]

# ③ 批量重放引擎（默认 dryRun，只发 prepare 不发激活）
#    启用前先确认 $prefs.gemini_adv_targets 已灌入待补账号
#    参数在 $prefs.gemini_adv_cfg 调整（perRound / gapMin / gapMax / dryRun）
*/6 * * * * https://raw.githubusercontent.com/yjlsx/qx/main/goog/gemini_adv_replay.js, tag=Gemini高级商务重放, enabled=false


[filter_local]

# QUIC 处理说明见文件头，QX 无 AND 规则。
# 若选择做法 c（全局拦 UDP/443），取消下面这行注释：
# DEST-PORT,443,REJECT-DROP,udp

# 默认直连，按需调整
# FINAL,DIRECT


# ============================================================
# 排错速查
# ============================================================
#
# 现象                          原因                        处理
# ──────────────────────────── ────────────────────────── ──────────────────
# 页面白屏 / SKU 没变            QUIC 没关                  设置里关 HTTP/3
# 管理页 404                     ①-1 没生效                 检查规则顺序，窄的在前
# 管理页开了但保存报 503         $prefs 不可用              QX 版本过老，升级
# 报告页 storageAvailable=false  $prefs 读写异常            同上
# 收不到"票据已入库"通知         ②-1 或 ②-1' 没挂           检查 URL 与 MITM 域
# batchexecute 被误改            规则顺序或版本问题         确认 ①-2 是 response-body
# one.google.com 完全无流量      证书未信任                 重装 MITM 证书
#
# ============================================================
# 脚本源（7 个，全部自包含，无相互引用）
# ============================================================
#
#  g1-acq.qx.js              映射引擎
#  g1-sku-report.qx.js       管理页 + 导出
#  gemini_prepare_capture.js 交易请求截获
#  gemini_prepare_response.js 交易响应解析
#  gemini_sku_probe.js       SKU 目录解析
#  gemini_activate_capture.js 激活 RPC 探测
#  gemini_adv_replay.js      批量重放
#
# ============================================================
