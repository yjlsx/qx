# Quantumult X 配置文件片段（合并进你的主配置）

## 【必改】两条 rewrite 不能挂同一个 URL

QX 同一 URL 只生效一条 rewrite。想同时抓 prepare 的请求体和响应体，二选一：

- 方案 A（推荐）：只挂 `script-response-body` 版本，能拿到 JWS / appAccountToken，但客户端会真的进 Apple 支付流程
- 方案 B：只挂 `script-request-body` + `reject-200`，能拦住支付，但拿不到 JWS
- 方案 C：分两次跑 —— 先关拦截跑一遍（抓响应），复制 `$prefs.gemini_adv_vault` 备份，再开拦截抓请求

[mitm]
hostname = %APPEND% applecommerce-pa.googleapis.com, one.google.com, play.googleapis.com, accounts.google.com, www.googleapis.com, ogads-pa.clients6.google.com

[rewrite_local]

# ---------- ① 交易创建：拦请求（方案 B） ----------
^https:\/\/applecommerce-pa\.googleapis\.com\/v1\/transactions:prepare url script-request-body gemini_prepare_capture.js reject-200

# ---------- ① 交易创建：抓响应（方案 A，与上面二选一） ----------
# ^https:\/\/applecommerce-pa\.googleapis\.com\/v1\/transactions:prepare url script-response-body gemini_prepare_response.js

# ---------- ② SKU 目录（低频，可长期开） ----------
^https:\/\/applecommerce-pa\.googleapis\.com\/\$rpc\/google\.subscriptions\.apple\.commerce\.v1\.AppleCommerceService\/ListProducts url script-response-body gemini_sku_probe.js

# ---------- ③ 激活写入 RPC 探测（放行不拦，只记录新 rpcid） ----------
^https:\/\/one\.google\.com\/_\/SubscriptionsManagementUi\/data\/batchexecute url script-request-body gemini_activate_capture.js


[task_local]

# 每 6 分钟跑一轮重放（默认 dryRun=true，只 prepare 不激活）
*/6 * * * * gemini_adv_replay.js, tag=Gemini高级商务重放, enabled=true


[filter_local]

# 保持默认直连，需要时再给 googleapis 加策略
# FINAL,DIRECT


# ============================================================
# 关于你原来的那条 rewrite
# ============================================================
# ^https://one.google.com/ai\?.*$
#
# 问题：
#   1. `\?` 是字面问号，只匹配 "ai?xxx"，漏掉 "/ai" 与 "/ai/subscribe"
#   2. `ai` 后面没有边界，会误命中 "ai_plan"、"aim"
#   3. 最关键：这条 URL 是【页面导航】(返回 1.25MB HTML)，
#      body 是产品列表 protobuf，不含任何票据，
#      拦它只会让页面白屏，拿不到任何东西
#
# 正确写法（如果确实需要拦页面）：
#   ^https:\/\/one\.google\.com\/ai(\/|\?|$)
#
# 但本方案已放弃这条，真正的交易入口在 applecommerce-pa.googleapis.com
