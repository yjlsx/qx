# ==============================================================
# G1 ACQ Plus → Quantumult X 配置
# 转换自 https://raw.githubusercontent.com/Dgkncn/g1-acq-plus/main/g1-acq-v8.sgmodule
#
# 原 sgmodule 的三个组件与 QX 的对应关系：
#   [Rule]   AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP
#            → 见下方 [filter_local] 的 udp443 说明（QX 语法不同，用 nodelay/url 规则替代）
#   [Script] g1-acq        (http-response, ^https://one.google.com/)
#            → gemini rewrite 的 ③
#   [Script] g1-sku-report (http-request,  ^https://one.google.com/g1-sku-report/?)
#            → gemini rewrite 的 ④
#   [MITM]   one.google.com
#            → 已并入 [mitm]
# ==============================================================


[mitm]
# G1 映射引擎 + 报告页
hostname = %APPEND% one.google.com
# 本工装新增（高级商务交易链）——不需要的话可删
hostname = %APPEND% applecommerce-pa.googleapis.com, play.googleapis.com, accounts.google.com, www.googleapis.com, ogads-pa.clients6.google.com


[rewrite_local]

# ─────────────────────────────────────────────────────────────
# G1 ACQ Plus 本体（转换后的两个脚本）
# ─────────────────────────────────────────────────────────────

# ① G1 映射引擎：改写 one.google.com 响应里的 SKU
#    上游 pattern 是 ^https:\/\/one\.google\.com\/ 全量挂，脚本内部会自己判断
#    只有 /ai /plans /subscribe /upsell /about/plans 这几个路径才真的改写
^https:\/\/one\.google\.com\/ url script-response-body g1-acq.qx.js

# ② 管理页 + TXT 导出：拦请求，直接吐 HTML / 纯文本
#    必须先于 ① 生效，所以放在后面（QX 按顺序匹配，命中即停）
^https:\/\/one\.google\.com\/g1-sku-report\/?(\?.*)?$ url script-request-body g1-sku-report.qx.js reject

# ─────────────────────────────────────────────────────────────
# 本工装：高级商务交易链抓取（可选，与 G1 部分互不干扰）
# ─────────────────────────────────────────────────────────────

# ③ 交易创建：拦请求（方案 B）
^https:\/\/applecommerce-pa\.googleapis\.com\/v1\/transactions:prepare url script-request-body gemini_prepare_capture.js reject-200

# ③' 交易创建：抓响应（方案 A，与 ③ 二选一）
# ^https:\/\/applecommerce-pa\.googleapis\.com\/v1\/transactions:prepare url script-response-body gemini_prepare_response.js

# ④ SKU 目录
^https:\/\/applecommerce-pa\.googleapis\.com\/\$rpc\/google\.subscriptions\.apple\.commerce\.v1\.AppleCommerceService\/ListProducts url script-response-body gemini_sku_probe.js

# ⑤ 激活写入 RPC 探测（只记录，不拦）
^https:\/\/one\.google\.com\/_\/SubscriptionsManagementUi\/data\/batchexecute url script-request-body gemini_activate_capture.js


[task_local]
# 高级商务批量重放（默认 dryRun，只 prepare 不激活）
*/6 * * * * gemini_adv_replay.js, tag=Gemini高级商务重放, enabled=false


[filter_local]

# ─────────────────────────────────────────────────────────────
# 关于原 sgmodule 的这条规则：
#   AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP
#
# 作用是拦掉 UDP/443（QUIC），逼支持回退的请求改走 TCP，
# 这样 MITM 才能看到明文。SG 的 REJECT-NO-DROP 是「不发 RST，
# 静默丢弃」，QX 没有等价的单条规则——QX 没有 AND 逻辑操作符。
#
# QX 的可行做法（任选其一）：
#
#   做法 1（推荐）：全局关 QUIC
#     设置 → 其他设置 → 关闭「HTTP/3 (QUIC)」
#     或在节点参数里让服务端禁用 UDP
#
#   做法 2：用 QX 的 hostname 规则把 google 系域名强制走不支持 UDP 的节点
#     HOST-SUFFIX,google.com,PROXY_NO_UDP
#     HOST-SUFFIX,googleapis.com,PROXY_NO_UDP
#
#   做法 3：QX 支持 udp-reject 的 filter 写法（部分版本）：
#     DEST-PORT,443,REJECT-DROP,udp
#     注意这条会连带拦掉所有 UDP 443，包括正常 QUIC 流量
# ─────────────────────────────────────────────────────────────

# 如果 MITM 看不到 one.google.com 的明文，先按上面三条排查 QUIC。
# 默认直连，按需调整。
# FINAL,DIRECT


# ==============================================================
# 排错对照
# ==============================================================
#
# 现象                          原因                          处理
# ──────────────────────────── ──────────────────────────── ─────────────────────
# 打开 /ai 页面白屏              rewrite 命中但脚本返回空      看 QX 日志有没有 [g1-acq] 行
# SKU 没被改写                   1) QUIC 未禁用                先关 HTTP/3
#                                2) MITM 证书未信任            重装证书
#                                3) 响应是 gzip 且 max-size 超限 QX rewrite 无 max-size 概念，不用管
# 管理页 404                     ② 这条没生效                  检查脚本文件名与路径
# 管理页能开但保存报 503         $prefs 不可用                 QX 版本过老，升级
# 报告页显示 storageAvailable=false  $prefs 读写异常           同上
# batchexecute 报错              ① 误改写了 RPC               上游已在脚本内排除，确认版本
